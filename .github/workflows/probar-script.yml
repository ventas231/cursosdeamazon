# Prueba temporal: escribe UNA fila de prueba en cada hoja (correos y compras).
name: Probar script de Sheets
on:
  push:
    branches: [claude/summaproducts-footer-test-0ebqm8]
    paths: [.github/workflows/probar-script.yml]
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          p() { curl -sS -L -H 'Content-Type: text/plain;charset=utf-8' --data "$1" "https://script.google.com/macros/s/AKfycbyR-SRy-p516qEAIuZzdYpE11VKBweL7EZrnjzEBZAnBW4tQ3_bQxRVJZZD7bETAUpz/exec"; echo; }
          echo "1) correo:";  p '{"action":"subscribe","whatsapp":"prueba-claude@summaproducts.com"}'
          sleep 2
          echo "2) checkout:"; p '{"action":"checkout","whatsapp":"prueba-claude@summaproducts.com","label":"Llegó a checkout"}'
          echo "3) compra:";   p '{"action":"purchase","email":"prueba-claude@summaproducts.com","amount":"PRUEBA - borrar"}'
