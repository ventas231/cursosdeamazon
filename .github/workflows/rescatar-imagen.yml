# Copia una sola vez la imagen de vista previa (og:image) al repositorio.
name: Rescatar imagen de vista previa
on:
  push:
    branches: [claude/summaproducts-footer-test-0ebqm8]
    paths: [.github/workflows/rescatar-imagen.yml]
permissions:
  contents: write
jobs:
  rescatar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL --retry 3 -o public/og-image.png "https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev/22c2aeb1-ad80-4058-92a3-d8e4a85a7c30/id-preview-b5fe2f19--dc354da1-0939-4e08-91a9-7ed90ab6c95f.lovable.app-1780355409483.png"
          file public/og-image.png; ls -l public/og-image.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og-image.png && git commit -m "Copia la imagen de vista previa al repositorio" && git push
